# Crossfire archive — live site config.
#
# The rewrite rules below come from the archive's own `raw/nginx-rules.txt`,
# which is the config the mirror was originally built against. They map the
# original crossfire.nu URL scheme onto the flat filenames the crawler wrote.
# (That config was written to serve the mirror under crossfire.fun; its
# `server_name` is dropped here so the image answers on any host.)
#
# Two deliberate deviations from that file are marked DEVIATION below. Every
# other rule is preserved as written.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /site/raw;
    index index.html index.htm;

    absolute_redirect off;
    server_tokens     off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- articles
    rewrite ^/(articles)/view/id/(\d+)/page/(\d+) /$1/$2.page.$3.html last;
    rewrite ^/(articlepages)/view/id/(\d+)      /$1/$2.html last;

    # ------------------------------------------------------- indexed sections
    rewrite ^/(journals|news|articles|tutorials|videos|polls|group)/?$
            /$1/index.page.1.html last;
    rewrite ^/(journals|news|articles|tutorials|videos|polls|group)/index/page/(\d+)
            /$1/index.page.$2.html last;
    rewrite ^/(journals|news|articles|tutorials|videos|polls|group)/index/author/(\d+)/page/(\d+)$
            /$1/index.author.$2.page.$3.html last;
    rewrite ^/(journals|news|articles|tutorials|videos|polls|group)/index/author/(\d+)$
            /$1/index.author.$2.page.1.html last;

    # /news/1/some-slug -> /news/1.some-slug.html
    rewrite ^/(journals|news|articles|tutorials|videos|polls|group)/(\d+)/(.*)
            /$1/$2.$3.html last;

    # /news/view/id/1 -> /news/1.html
    #
    # DEVIATION (A): as shipped, this rule 404s for ~125,000 pages. Outside of
    # `group`, no section actually contains bare `<id>.html` files — every page
    # is `<id>.<slug>.html`. The original config carries the author's own note,
    # "todo, fix these, change filenames to just ids"; it was never done.
    #
    # Rather than change the rule, the entrypoint creates one `<id>.html`
    # symlink per page after extraction, so this resolves exactly as written.
    rewrite ^/(journals|news|articles|tutorials|videos|polls|group)/view/id/(\d+)
            /$1/$2.html last;

    # ------------------------------------------------------- forums / threads
    rewrite ^/threads/?$ /forums/ last;

    # DEVIATION (B): the original listed the unanchored `view/id/(\d+)` rule
    # first, so it matched `/forums/view/id/9/page/2` too and sent every page
    # to page 1 — stranding the 438 forum pages >= 2 that exist in the archive.
    # The two rules are swapped here; no previously-working URL changes.
    rewrite ^/forums/view/id/(\d+)/page/(\d+) /forums/view.id.$1.page.$2.html last;
    rewrite ^/forums/view/id/(\d+)            /forums/view.id.$1.page.1.html last;

    rewrite ^/threads/(\d+)/(.*) /threads/$1.$2.html last;

    # ------------------------------------------------------------------- users
    rewrite ^/user/view/id/(\d+)/?$                /user/$1.html last;
    rewrite ^/user/view/id/(\d+)/tab/information   /user/$1.html last;
    rewrite ^/user/view/id/(\d+)/tab/activity      /user/$1.tab.activity.html last;
    rewrite ^/user/(\d+)/(.*)                      /user/$1.html last;

    rewrite ^/user/tos/?$ /tos.html last;

    # ------------------------------------------------------------------ errors
    error_page 404 /404.html;

    # ------------------------------------------------------------------ assets
    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|bmp|woff2?|ttf|eot|mp4|webm|swf)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /user {
        autoindex off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
