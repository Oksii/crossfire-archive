# Crossfire archive — holding config.
#
# This is what's live from the moment the container starts. It answers every
# request with 503 + Retry-After while the archive downloads and extracts, so
# anything in front of us (and anyone with a browser open) gets an honest
# answer instead of a refused connection.
#
# The entrypoint swaps in site.conf and reloads once extraction succeeds.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root          /usr/share/nginx/preparing;
    server_tokens off;
    access_log    off;

    location = /503.html {
        internal;
        add_header Retry-After  60          always;
        add_header Cache-Control "no-store" always;
    }

    error_page 503 /503.html;

    location / {
        return 503;
    }
}
